name: Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: limitlane-x86_64-unknown-linux-gnu.tar.gz
            asset_name: limitlane
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: limitlane-aarch64-apple-darwin.tar.gz
            asset_name: limitlane
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: limitlane-x86_64-pc-windows-msvc.zip
            asset_name: limitlane.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux/macOS binary
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      - name: Package Windows binary
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.asset_name }} -DestinationPath ../../../${{ matrix.artifact_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
